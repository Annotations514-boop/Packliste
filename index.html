<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>if(/\.netlify\.app$/i.test(location.hostname))document.documentElement.classList.add('nfb')</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c2517a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reiseliste">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Reiseliste</title>
<style>
:root{
  --bg:#f2f4f3;--panel:#ffffffa0;--panel2:#e8eeec;--ink:#14201d;--ink2:#41524d;--mute:#74857f;--line:#e2e9e6;
  --accent:#0f766e;--accent-ink:#ffffff;--accent-soft:#d6efeb;--warn:#b45309;--warn-soft:#fdecd0;--danger:#c0392b;--ok:#16a34a;
  --deco:none;--deco-size:200px;--deco-o:.2;
  --safe-b:env(safe-area-inset-bottom);--safe-t:env(safe-area-inset-top);
  --spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1210;--panel:#151f1ca0;--panel2:#1d2924;--ink:#e8f1ee;--ink2:#b5c6c0;--mute:#82948e;--line:#243029;
    --accent:#2dd4bf;--accent-ink:#04201c;--accent-soft:#12332e;--warn:#fbbf24;--warn-soft:#3a2d0f;--danger:#f87171;--ok:#4ade80;--deco-o:.12;
  }
}
/* Designs: Leopard, Nacktkatze, Tiger, Schwarze Katze (je Hell und Dunkel) */
:root[data-skin="leo"]{--bg:#efe4d2;--panel:#fffaf3a0;--panel2:#e9dac1;--ink:#2d2118;--ink2:#5d4632;--mute:#8d7a63;--line:#e3d3b8;--accent:#9a5b24;--accent-ink:#fff;--accent-soft:#f1dcbd;--warn:#9a5b24;--warn-soft:#f1dcbd;--deco-o:.5}
:root[data-skin="sphynx"]{--bg:#fbeef1;--panel:#fffafb99;--panel2:#f6dfe6;--ink:#3b2430;--ink2:#6d4c59;--mute:#a07f8c;--line:#f0d5dd;--accent:#c2517a;--accent-ink:#fff;--accent-soft:#fadbe6;--warn:#c2517a;--warn-soft:#fadbe6;--deco-o:.55}
:root[data-skin="tiger"]{--bg:#fbe6cf;--panel:#fff6eaa0;--panel2:#f6d6b0;--ink:#261608;--ink2:#5a3a1e;--mute:#8d6a45;--line:#efcaa0;--accent:#c2410c;--accent-ink:#fff;--accent-soft:#fbd2a6;--warn:#c2410c;--warn-soft:#fbd2a6}
:root[data-skin="schwarz"]{--bg:#120f1a;--panel:#1c1727a0;--panel2:#261f35;--ink:#f1ecff;--ink2:#c7bee0;--mute:#8f86aa;--line:#2e2640;--accent:#facc15;--accent-ink:#1a1500;--accent-soft:#3a3210;--warn:#facc15;--warn-soft:#3a3210;--danger:#f87171;--ok:#4ade80;--deco-o:.16}
@media (prefers-color-scheme:dark){
  :root[data-skin="leo"]:not([data-theme="light"]){--bg:#1d1610;--panel:#2a2018a0;--panel2:#372b20;--ink:#f3e7d3;--ink2:#d4c0a0;--mute:#9f8c70;--line:#3d3023;--accent:#e0a458;--accent-ink:#25190c;--accent-soft:#45331c;--warn:#e0a458;--warn-soft:#45331c;--deco-o:.35}
  :root[data-skin="sphynx"]:not([data-theme="light"]){--bg:#1f1419;--panel:#2b1c2499;--panel2:#38252f;--ink:#f9e6ee;--ink2:#dcbccb;--mute:#a98796;--line:#43303a;--accent:#f08fb2;--accent-ink:#2a1019;--accent-soft:#4d2a39;--warn:#f08fb2;--warn-soft:#4d2a39;--deco-o:.35}
  :root[data-skin="tiger"]:not([data-theme="light"]){--bg:#1a1008;--panel:#281a0ea0;--panel2:#352414;--ink:#fbe6cf;--ink2:#e0bd92;--mute:#aa8660;--line:#3d2a17;--accent:#fb923c;--accent-ink:#1a1008;--accent-soft:#4a2c12;--warn:#fb923c;--warn-soft:#4a2c12}
  :root[data-skin="schwarz"]:not([data-theme="light"]){--bg:#120f1a;--panel:#1c1727a0;--panel2:#261f35;--ink:#f1ecff;--ink2:#c7bee0;--mute:#8f86aa;--line:#2e2640;--accent:#facc15;--accent-ink:#1a1500;--accent-soft:#3a3210}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:calc(var(--safe-t) + 4px) 16px calc(var(--safe-b) + 110px);min-height:100vh;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;transition:background-color .4s}
body::before{content:'';position:fixed;inset:0;z-index:-1;background-image:var(--deco);background-size:var(--deco-size);opacity:var(--deco-o);pointer-events:none}
input,textarea{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
.wrap{max-width:600px;margin:0 auto}
h1{font-size:32px;line-height:1.05;margin:14px 0 4px;letter-spacing:-.02em;font-weight:800}
h2{font-size:17px;margin:0;font-weight:700}
h3{font-size:15px;margin:0 0 8px;font-weight:800}
p{margin:0}
.muted{color:var(--mute)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopf */
.sticky{position:sticky;top:0;z-index:6;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(var(--safe-t) + 6px) 16px 10px;margin:0 -16px}
.topbar{display:flex;align-items:center;gap:8px;min-height:44px}
.topbar .grow{flex:1;min-width:0}
.topbar h2{font-size:20px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--mute)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);transition:transform .15s var(--spring),background .2s;flex:none}
.icon-btn:active{transform:scale(.88);background:var(--panel2)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.prog{display:flex;align-items:center;gap:10px;margin-top:6px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));border-radius:99px;transition:width .7s var(--out)}
.bar.done>i{background:var(--ok)}
.bar.over>i{background:var(--warn)}
.pct{font-variant-numeric:tabular-nums;font-weight:800;font-size:14px;min-width:38px;text-align:right}
.pct.bump{animation:bump .5s var(--spring)}
.tabs{display:flex;background:var(--panel2);border-radius:12px;padding:3px;gap:3px;margin:8px 0 14px}
.tabs button{flex:1;min-height:40px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .25s,box-shadow .25s,color .25s;padding:0 4px;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.tabs b{font-size:12px;min-width:22px;padding:1px 6px;border-radius:99px;background:var(--panel);color:var(--ink2);font-variant-numeric:tabular-nums;text-align:center}
.tabs button[aria-pressed="true"] b{background:var(--accent);color:var(--accent-ink)}
.tabs b.bump{animation:bump .5s var(--spring)}

/* Buttons und Karten */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--panel2);font-weight:600;transition:transform .15s var(--spring)}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.space{justify-content:space-between}
.hero{display:grid;gap:14px;margin:6px 0 18px}
.homehead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.trip{display:grid;gap:10px;text-align:left;width:100%;transition:transform .2s var(--spring)}
.trip:active{transform:scale(.975)}
.trip .name{font-size:18px;font-weight:700}
.tripexp{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700}
.tripexp .nw{white-space:nowrap}
.tripexp .sm{font-size:13px;font-weight:600}
.tripexp.none{background:var(--panel2);color:var(--mute);font-weight:600}
.sech{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:20px 4px 10px}
.sumcard{margin-top:14px;display:grid;gap:4px;text-align:left;width:100%;transition:transform .2s var(--spring)}
.dhead{display:flex;gap:12px;align-items:center;margin-bottom:6px;text-align:left}
.dnote{font-size:18px;font-weight:700;line-height:1.3}
.damt{font-size:34px;font-weight:800;margin:6px 0 10px}
.dlist{border-top:1px solid var(--line)}
.drow{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.drow span{color:var(--mute);flex:none}
.drow b{text-align:right;font-weight:600}
.tabs{gap:2px}
.tabs button{font-size:12.5px;gap:3px;padding:0 1px;min-width:0;letter-spacing:-.01em}
.tabs b{font-size:11px;min-width:18px;padding:1px 5px}
.spday{display:grid;gap:6px;width:100%;text-align:left;background:var(--panel);border-radius:16px;padding:12px 14px;box-shadow:0 0 0 1px var(--line);margin-top:8px}
.spday:active{transform:scale(.985)}
.spl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sptype{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.spm,.spn{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink2)}
.spn{border-top:1px solid var(--line);padding-top:6px;color:var(--ink);font-weight:700}
.mc.on{background:var(--accent);color:var(--accent-ink)}
.sprow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.spk{font-weight:600}
.sprow small{display:block;color:var(--mute);font-size:12px}
.sprow small.man{color:var(--accent);font-weight:700}
.spv{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:12px;padding:8px 12px;font-size:15px;flex:none}
.spv i{font-style:normal;color:var(--mute)}
.spres{margin-top:12px;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px}
.spres.pos{background:rgba(34,197,94,.18)}
.spres.neg{background:rgba(249,115,22,.2)}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.segb{padding:8px 12px;border-radius:10px;background:var(--panel2);font-weight:600;font-size:14px;color:var(--ink2)}
.segb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.spq{font-size:13px;color:var(--mute);font-weight:600;width:100%}
.swipe.pressing .item{transform:scale(.96);transition:transform .5s ease-out}
.swipe .item{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.tplrow{flex-wrap:wrap;row-gap:6px}
.tplrow .lbl{flex:1 1 calc(100% - 46px);min-width:0}
.tplrow .grip{margin-right:-4px}
.tplrow select{margin-left:42px}
.tplrow .del{margin-left:auto}
.spadd{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.spadd select{grid-column:1/3}
.spadd #sd-n2{grid-column:1/2}
.spadd .btn{grid-column:1/3}
.spit{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.spit span{flex:1}
.spit button{width:32px;height:32px;border-radius:50%;background:var(--panel2);color:var(--ink2)}
.spbig{padding:14px 16px}
.spbig .sumval{font-size:34px}
.spby{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.spby span{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--ink2)}
.artgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.artb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;min-height:84px;justify-content:center;border-radius:16px;background:var(--panel);box-shadow:0 0 0 1px var(--line);font-weight:700;font-size:14px;text-align:center}
.artb span{font-size:26px}
.artb:active{transform:scale(.96)}
.artsel{display:inline-block;padding:6px 14px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:800}
.sprowh{display:flex;justify-content:space-between;width:100%;padding:10px 0 0;font-size:15px;color:var(--ink2);text-align:left}
.sprowh b{color:var(--ink)}
.wxc{display:grid;gap:6px;text-align:left;width:100%;margin-top:4px}
.wxh{font-weight:700}
.wxb{width:34px;height:34px;border-radius:50%;background:var(--panel2);color:var(--ink2);font-size:16px}
.wxs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.wxs:not(.full) .wxd{background:none;padding:4px 2px;min-width:44px}
.wxs:not(.full) .wxd i{font-size:28px}
.wxd{flex:none;min-width:58px;display:grid;justify-items:center;gap:2px;padding:8px 6px;border-radius:14px;background:var(--panel2);font-size:12px;color:var(--ink2)}
.wxd i{font-style:normal;font-size:24px}
.wxd b{font-size:15px;color:var(--ink)}
.wxd em{font-style:normal;font-size:11px;color:var(--accent);min-height:13px;font-weight:700}
.wxsum{margin:4px 0 0;font-size:14px}
.spph{margin:8px 0 6px;display:grid;gap:6px}
.phs{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.pht{flex:none;width:74px;height:96px;border-radius:12px;overflow:hidden;background:var(--panel2);padding:0}
.pht img{width:100%;height:100%;object-fit:cover;display:block}
.phview{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.phview img{max-width:100%;max-height:78vh;border-radius:10px;object-fit:contain}
.phbar{display:flex;gap:10px}
.tdel{width:36px;height:36px;border-radius:50%;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer}
.tdel:active{transform:scale(.88);background:rgba(220,38,38,.18)}
.sumtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sumtiles.one{grid-template-columns:1fr}
.sumtile{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:18px;background:var(--panel);box-shadow:0 0 0 1px var(--line);transition:transform .2s var(--spring)}
.sumtile:active{transform:scale(.96)}
.sumtile span{font-size:13px;font-weight:700;color:var(--mute)}
.sumtile b{font-size:19px;font-weight:800;color:var(--ink)}
.tripfoot{display:flex;gap:8px;flex-wrap:wrap}
.chip2{font-size:13px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.qedit{display:flex;align-items:center;justify-content:center;gap:22px}
.qedit button{width:58px;height:58px;border-radius:50%;background:var(--panel2);font-size:30px;font-weight:700;color:var(--ink);transition:transform .15s var(--spring)}
.qedit button:active{transform:scale(.88)}
.qedit b{font-size:44px;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.artb{position:relative}
.artb.own{background:var(--accent-soft);color:var(--accent)}
.artx{position:absolute;top:6px;right:6px;width:26px;height:26px;line-height:26px;border-radius:50%;background:var(--panel2);color:var(--mute);font-style:normal;font-size:12px;text-align:center}
.inrow{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.inrow span{font-size:12px;font-weight:700;color:var(--mute)}
.inrow a{color:var(--accent);font-weight:600;word-break:break-word}
.backc{display:grid;gap:4px;text-align:left;width:100%;margin-top:4px}
.backc.ok{background:rgba(34,197,94,.14)}
.bkrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);min-height:50px}
.bkc{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);flex:none;transition:background .2s,box-shadow .2s,transform .3s var(--spring);display:inline-flex;align-items:center;justify-content:center;color:var(--accent-ink);font-weight:800;font-size:15px}
.bkrow[aria-pressed="true"] .bkc{background:var(--accent);box-shadow:none;transform:scale(1.08)}
.bkrow[aria-pressed="true"] .bkc::after{content:'✓'}
.bkn{flex:1;transition:color .2s}
.bkrow[aria-pressed="true"] .bkn{color:var(--mute);text-decoration:line-through}
textarea{width:100%;border-radius:12px;background:var(--panel2);padding:12px 14px;font:inherit;color:var(--ink);resize:vertical;min-height:70px}
.bkcard{display:grid;gap:10px;background:var(--accent-soft)}
.mnrs{padding:6px 14px;display:grid}
.mnr{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.mnr:last-child{border-bottom:0}
button.mnr{border-radius:10px}
button.mnr.on{background:var(--accent-soft);margin:0 -8px;padding:10px 8px;width:calc(100% + 16px)}
.ml{display:block;font-weight:600;font-size:14px;text-align:left}
.mb{display:block;height:8px;min-width:40px;border-radius:99px;background:var(--panel2);overflow:hidden}
.mb i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.mnr b{font-size:14px;font-variant-numeric:tabular-nums}
.chipsel{margin:12px 0 0;padding:8px 14px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
.yearsw{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0}
.yearsw b{font-size:22px;min-width:70px;text-align:center}
.yearsw .calnav:disabled{opacity:.3}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.rt{display:grid;align-content:start;gap:2px;padding:14px;border-radius:18px;background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.rt span{font-size:12px;font-weight:700;color:var(--mute)}
.rt b{font-size:20px;font-weight:800}
.rt small{font-size:12px;color:var(--mute)}
.rbars{display:flex;gap:4px;align-items:flex-end;padding:14px 10px 8px}
.rb{flex:1;display:grid;justify-items:center;gap:4px}
.rb b{font-size:11px;min-height:14px}
.rbar{width:100%;max-width:22px;height:84px;display:flex;align-items:flex-end;border-radius:8px;background:var(--panel2);overflow:hidden}
.rbar i{display:block;width:100%;border-radius:8px;background:var(--accent)}
.rb em{font-style:normal;font-size:11px;font-weight:700;color:var(--mute)}
.mhd,.mrow2{display:grid;grid-template-columns:76px 1fr 1fr;gap:8px;padding:8px 0;font-size:13px}
.mhd{color:var(--mute);font-weight:700;border-bottom:1px solid var(--line)}
.mrow2{border-bottom:1px solid var(--line)}
.mrow2:last-child{border-bottom:0}
.mrow2 b{font-size:14px;font-variant-numeric:tabular-nums}
.srch{margin:10px 0 12px}
.srch input{width:100%;padding:12px 16px;border-radius:14px;border:0;background:var(--panel);box-shadow:0 0 0 1px var(--line);font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
.srch input:focus{outline:2px solid var(--accent)}
.helpl{display:grid;gap:8px}
.helpl details{background:var(--panel2);border-radius:14px;padding:0 14px}
.helpl summary{display:flex;gap:10px;align-items:center;padding:13px 0;cursor:pointer;list-style:none;font-size:15px}
.helpl summary::-webkit-details-marker{display:none}
.helpl summary span{font-size:20px}
.helpl ol{margin:0;padding:0 0 14px 0;list-style:none;display:grid;gap:10px;counter-reset:h}
.helpl li{counter-increment:h;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:15px;line-height:1.4;color:var(--ink)}
.helpl li::before{content:counter(h);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;display:grid;place-items:center}
.helpl li b{color:var(--accent)}
.grip{flex:none;width:28px;align-self:stretch;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:20px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;margin-left:-6px}
.sec-h .grip{align-self:center;height:28px}
.dph{position:fixed;z-index:4;border-radius:16px;border:2px dashed var(--accent);background:var(--accent-soft);pointer-events:none;transition:top .2s var(--out),height .2s;box-sizing:border-box}
body.dragmode .tplrow{flex-wrap:nowrap}
body.dragmode .tplrow .lbl{flex:1 1 auto}
body.dragmode .tplrow select,body.dragmode .tplrow .step,body.dragmode .tplrow .del,body.dragmode .addrow,body.dragmode .sec-h .cnt{display:none!important}
body.dragcat .sec>.list{display:none}
body.dragcat .sec{margin-bottom:6px}
.dragging,.settling{position:relative;z-index:5;border-radius:18px}
.dragging{box-shadow:0 12px 32px rgba(0,0,0,.28);background:var(--panel);transition:none!important;will-change:transform}
.settling{transition:transform .26s cubic-bezier(.2,.8,.2,1),box-shadow .26s}
body.dragmode{user-select:none;-webkit-user-select:none;overflow-anchor:none}
.bkcoin{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;padding:9px 14px;border-radius:12px;background:var(--accent-soft);font-size:13px;color:var(--ink2)}
.bkcoin b{font-size:15px;color:var(--accent);white-space:nowrap}
.bkcoin b.pop{animation:bkpop .5s var(--spring)}
@keyframes bkpop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.homepills{margin:24px 0 8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.setbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;min-height:62px;cursor:pointer}
.setbtn+.setbtn{border-top:1px solid var(--line)}
.setbtn b{display:block}
.setbtn small{display:block;color:var(--mute);font-size:13px;font-weight:500}
.sico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.setbtn:active{background:var(--panel2)}
.homelinks{margin:26px 0 8px;display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;align-items:center;font-size:13px;color:var(--mute)}
.homelinks button,.homelinks label{color:var(--mute);font-weight:600;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;cursor:pointer}
.lnk{color:var(--accent);font-weight:700;font-size:14px;padding:6px 4px}
.txtlinks{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;margin:8px 0}
.wxadd{display:block;margin:2px 0 8px}
.wxtop{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px;text-align:left}
.phrow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 16px;border-radius:14px;background:var(--panel2);font-weight:600}
.spbig .sumlab{margin-bottom:0}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:4px;padding:6px max(10px,calc((100vw - 600px)/2)) calc(var(--safe-b) + 6px);background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,0,0,.05)}
#bnav[hidden]{display:none}
#bnav button{position:relative;flex:1;max-width:150px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:14px;color:var(--mute);font-weight:700;font-size:11px;transition:color .2s,background .2s,transform .15s var(--spring)}
#bnav button:active{transform:scale(.92)}
#bnav button i{font-style:normal;font-size:22px;line-height:1;filter:grayscale(.85) opacity(.7);transition:filter .2s}
#bnav button[aria-pressed="true"]{color:var(--accent)}
#bnav button[aria-pressed="true"] i{filter:none;transform:translateY(-2px) scale(1.12)}
#bnav button i{display:block;transition:transform .35s var(--spring),filter .2s}
#bnav button span{transition:color .25s}
#bnav .bind{position:absolute;left:0;top:6px;height:54px;width:0;border-radius:14px;background:var(--accent-soft);opacity:0;transition:transform .5s var(--spring),width .35s var(--out),opacity .2s;pointer-events:none}
#bnav button{z-index:1}
#bnav.enter button{animation:navin .5s var(--out) both;animation-delay:calc(var(--k)*45ms)}
@keyframes navin{from{opacity:0;transform:translateY(18px) scale(.9)}}
#bnav button.act[data-ic="home"] i{animation:nhop .6s var(--spring)}
#bnav button.act[data-ic="bag"] i{animation:nswing .65s ease-out}
#bnav button.act[data-ic="done"] i{animation:npop .55s var(--spring)}
#bnav button.act[data-ic="paw"] i{animation:nwig .65s ease-out}
#bnav button.act[data-ic="rec"] i{animation:nrec .55s var(--spring)}
#bnav button.act[data-ic="gear"] i{animation:ngear .7s var(--spring)}
@keyframes nhop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-12px) scale(.92,1.12)}62%{transform:translateY(0) scale(1.18,.82)}100%{transform:translateY(-2px) scale(1.12)}}
@keyframes nswing{0%{transform:translateY(-2px) scale(1.12) rotate(0)}25%{transform:translateY(-2px) scale(1.2) rotate(-24deg)}55%{transform:translateY(-2px) scale(1.2) rotate(18deg)}80%{transform:translateY(-2px) scale(1.12) rotate(-7deg)}100%{transform:translateY(-2px) scale(1.12) rotate(0)}}
@keyframes npop{0%{transform:scale(.4)}55%{transform:scale(1.55)}100%{transform:translateY(-2px) scale(1.12)}}
@keyframes nwig{0%{transform:translateY(-2px) scale(1.12) rotate(0)}20%{transform:translateY(-6px) scale(1.3) rotate(-20deg)}40%{transform:translateY(-2px) scale(1.3) rotate(16deg)}60%{transform:translateY(-4px) scale(1.2) rotate(-10deg)}80%{transform:translateY(-2px) scale(1.15) rotate(5deg)}100%{transform:translateY(-2px) scale(1.12) rotate(0)}}
@keyframes nrec{0%{transform:translateY(10px) scale(.85)}50%{transform:translateY(-10px) scale(1.25)}100%{transform:translateY(-2px) scale(1.12)}}
@keyframes ngear{0%{transform:rotate(-200deg) scale(.7)}100%{transform:translateY(-2px) rotate(0) scale(1.12)}}
@media (prefers-reduced-motion:reduce){#bnav *{animation:none!important;transition:none!important}}
#bnav b{position:absolute;top:3px;right:calc(50% - 30px);min-width:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:11px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
#bnav b.bump{animation:bump .5s var(--spring)}
body.hasnav .fab{bottom:calc(var(--safe-b) + 78px)}
html.nfb{--nfb:66px}
html.nfb #bnav{padding-bottom:calc(var(--safe-b) + 6px + var(--nfb))}
html.nfb body{padding-bottom:calc(var(--safe-b) + 110px + var(--nfb))}
html.nfb body.hasnav .fab{bottom:calc(var(--safe-b) + 78px + var(--nfb))}
html.nfb body.hasnav .say{bottom:calc(var(--safe-b) + 84px + var(--nfb))}
html.nfb .toast{bottom:calc(var(--safe-b) + 92px + var(--nfb))}
html.nfb .drinknudge{bottom:calc(var(--safe-b) + 90px + var(--nfb))}
.when{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.when b{color:var(--accent);font-weight:700;white-space:nowrap}
.cal{background:var(--panel);border-radius:16px;padding:10px;box-shadow:0 0 0 1px var(--line)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calhead b{font-size:16px}
.ar{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;flex:none}
.calnav .ar{width:20px;height:20px;vertical-align:0}
.nw2{white-space:nowrap;flex:none}
.rarr{display:inline-flex;align-items:center;justify-content:center;color:var(--mute);width:22px;height:22px;flex:none}
.rarr .ar{width:20px;height:20px;vertical-align:0}
.setbtn .rarr{margin-left:auto}
.calnav{width:40px;height:40px;border-radius:50%;background:var(--panel2);font-size:24px;line-height:1;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cw{text-align:center;font-size:12px;font-weight:700;color:var(--mute);padding:4px 0}
.cd{height:42px;font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;border-radius:12px}
.cd.t{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cd.r{background:var(--accent-soft);border-radius:0}
.cd.s,.cd.e{background:var(--accent);color:var(--accent-ink)}
.calgrid.rng .cd.s:not(.e){border-radius:12px 0 0 12px}
.calgrid.rng .cd.e:not(.s){border-radius:0 12px 12px 0}
.calsum{margin-top:8px;font-size:14px;color:var(--ink2);text-align:center;font-weight:600;min-height:20px}
.sumcard:active{transform:scale(.975)}
.sumlab{font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.sumval{font-size:26px;font-weight:800;color:var(--ink)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--panel2);font-size:13px;color:var(--ink2);font-weight:600}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute)}
.empty{text-align:center;padding:34px 16px;color:var(--mute);display:grid;gap:10px;justify-items:center}
.empty .big{font-size:52px;animation:float 3s ease-in-out infinite}
.empty b{color:var(--ink);font-size:18px}

/* Listen */
.sec{margin:0 0 18px;transition:opacity .35s,transform .35s var(--out),margin .35s}
.sec.gone{opacity:0;transform:scale(.96);margin:0;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:8px;padding:0 4px 7px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.sec-h .ico{font-size:16px;letter-spacing:0}
.sec-h .ttl{flex:1}
.sec-h .cnt{font-variant-numeric:tabular-nums;letter-spacing:0}
.sec-add{margin-left:2px;padding:4px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:800;letter-spacing:0;text-transform:none;white-space:nowrap;transition:transform .15s var(--spring)}
.sec-add:active{transform:scale(.92)}
.sec.celebrate .sec-h .ico{animation:icobounce .9s var(--spring)}
.list{background:var(--panel);border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.swipe{position:relative;overflow:hidden;transition:height .32s var(--out),opacity .25s}
.swipe+.swipe::before{content:'';position:absolute;left:54px;right:0;top:0;height:1px;background:var(--line);z-index:1}
.swipe .bg{opacity:0;transition:opacity .15s;position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:14px}
.swipe.swiping .bg{opacity:1}
.swipe.armed .bg{background:var(--warn);color:var(--panel)}
.swipe.leaving{height:0!important;opacity:0}
.item{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:8px 14px;text-align:left;background:var(--panel);touch-action:pan-y;transition:transform .35s var(--out),background-color .2s}
.item:active{background:var(--panel2)}
.item.fresh{animation:slidein .6s var(--out),rowflash 1.2s ease-out}
.chk{position:relative;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--mute) 55%,var(--panel));display:inline-flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s}
.chk svg{width:15px;height:15px;stroke:var(--accent-ink);fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease .06s}
.chk::after{content:'';position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--accent);opacity:0;pointer-events:none}
.item.done .chk{background:var(--accent);border-color:var(--accent)}
.item.done .chk svg{stroke-dashoffset:0}
.item.pop .chk{animation:chkpop .5s var(--spring)}
.item.pop .chk::after{animation:ring .65s ease-out}
.lbl{flex:1;min-width:0;overflow-wrap:anywhere;transition:color .3s}
.lbl .t{background:linear-gradient(currentColor,currentColor) no-repeat 0 57%/0% 1.5px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .4s var(--out)}
.item.done .lbl{color:var(--mute)}
.item.done .lbl .t{background-size:100% 1.5px}
.qty{flex:none;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--panel2);color:var(--ink2);margin-left:8px;vertical-align:1px}
.addlink{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 14px;color:var(--accent);font-weight:600;background:var(--panel);border-radius:16px;box-shadow:0 0 0 1px var(--line);margin-bottom:18px}
.addlink .plus{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);display:inline-flex;align-items:center;justify-content:center}
.addlink svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round}
details.skipped{margin-bottom:18px}
details.skipped>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
details.skipped>summary::-webkit-details-marker{display:none}
details.skipped .ttl{flex:1}
details.skipped .chev{width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:2.4;transition:transform .3s var(--out)}
details.skipped[open] .chev{transform:rotate(180deg)}
details.skipped .list{margin-top:6px}
details.skipped .t{text-decoration:line-through;text-decoration-color:var(--mute)}
details.skipped .item{color:var(--mute)}

/* Bearbeiten */
.edit .item{cursor:default;gap:10px}
.step{display:inline-flex;align-items:center;gap:2px;flex:none}
.step button{width:34px;height:34px;border-radius:10px;background:var(--panel2);font-size:18px;font-weight:700;line-height:1;transition:transform .15s var(--spring)}
.step button:active{transform:scale(.88)}
.step b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.del{width:34px;height:34px;border-radius:10px;color:var(--danger);display:inline-flex;align-items:center;justify-content:center;flex:none}
.del svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.addrow{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line);background:var(--panel)}
input[type=text],input[type=number],input[type=date],select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid transparent;border-radius:12px;min-height:46px;padding:0 12px;width:100%;min-width:0}
.addrow input{flex:1}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--mute);font-weight:600}

/* Fenster, Hinweise */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet.mid{align-items:center;padding:20px}
.sheet>div{width:100%;max-width:600px;background:var(--bg);border-radius:22px 22px 0 0;padding:18px 16px calc(var(--safe-b) + 18px);max-height:92vh;max-height:calc(100dvh - 16px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:up .35s var(--out)}
body:has(.sheet){overflow:hidden}
.sheet.mid>div{border-radius:24px;text-align:center;animation:pop .5s var(--spring)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 92px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px 10px 16px;border-radius:14px;font-weight:600;z-index:70;max-width:92vw;display:flex;align-items:center;gap:12px;animation:toastin .35s var(--spring)}
.toast button{color:var(--accent);font-weight:800;filter:brightness(1.3)}
.fab{position:fixed;right:16px;bottom:calc(var(--safe-b) + 18px);z-index:8;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .2s var(--spring)}
.fab:active{transform:scale(.9)}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round}
.fab.in{animation:fabin .5s var(--spring) .3s both}
.say{position:fixed;left:16px;right:88px;bottom:calc(var(--safe-b) + 18px);z-index:9;display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px 8px 10px;border-radius:18px;background:var(--panel);box-shadow:0 8px 28px rgba(0,0,0,.2),0 0 0 1px var(--line);animation:sayin .45s var(--spring);pointer-events:none}
body.hasnav .say{bottom:calc(var(--safe-b) + 84px);right:16px}
.say.out{animation:sayout .3s ease-in forwards}
.say .em{font-size:34px;line-height:1;animation:wiggle .7s ease-in-out .2s}
.say b{display:block;font-size:15px}
.say span{display:block;font-size:13px;color:var(--mute);line-height:1.25}
.conf{position:fixed;z-index:80;pointer-events:none;border-radius:2px;line-height:1}
.enter .sec,.enter .hero,.enter .trip,.enter .tabs,.enter .xcard,.enter .sticky,.enter .sumcard,.enter .sech,.enter .day{animation:rise .5s var(--out) both;animation-delay:calc(var(--i,0)*50ms)}
.enter.fwd .sec,.enter.fwd .hero,.enter.fwd .trip,.enter.fwd .tabs,.enter.fwd .xcard,.enter.fwd .sticky,.enter.fwd .sumcard,.enter.fwd .sech,.enter.fwd .day{animation:slidein .42s var(--out) both;animation-delay:calc(var(--i,0)*35ms)}
.enter.back .sec,.enter.back .hero,.enter.back .trip,.enter.back .tabs,.enter.back .xcard,.enter.back .sticky,.enter.back .sumcard,.enter.back .sech,.enter.back .day{animation:slideback .42s var(--out) both;animation-delay:calc(var(--i,0)*35ms)}
.enter.tabsw .tabs,.enter.tabsw .sticky{animation:none}

/* Katze am Feld */
.cat-svg{display:block;overflow:visible}
.cat-svg .c-tail{transform-origin:70px 88px;animation:tailwag 1.3s ease-in-out infinite}
.cat-svg .c-eyes{transform-origin:50px 42px;animation:blink 4.2s infinite}
.rowcat{position:absolute;z-index:40;pointer-events:none;display:flex;flex-direction:column;align-items:flex-end;gap:0;animation:catin .6s var(--spring) both}
.rowcat.flip{flex-direction:column-reverse}
.rowcat .cat-svg{width:80px;height:80px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.25))}
.rowcat .bub{max-width:min(240px,64vw);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:14px;box-shadow:0 8px 22px rgba(0,0,0,.22),0 0 0 1px var(--line);font-size:13px;line-height:1.25;text-align:left;animation:bubpop .45s var(--spring) .25s both}
.rowcat .bub b{display:block;font-size:14px;margin-bottom:1px}
.rowcat.bye{animation:catbye .75s cubic-bezier(.5,0,.9,.6) forwards}
.rowcat.bye .bub{opacity:0;transition:opacity .2s}

.runner{position:fixed;left:0;width:0;height:88px;z-index:40;pointer-events:none}
.rn-cat{position:absolute;left:0;top:0;width:76px}
.rn-flip{width:76px;height:76px}
.rn-cat .cat-svg{width:76px;height:76px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.rn-name{position:absolute;left:50%;top:-20px;transform:translateX(-50%);white-space:nowrap;background:var(--panel);color:var(--ink);font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;box-shadow:0 2px 8px rgba(0,0,0,.2),0 0 0 1px var(--line)}

var DR=null;
function dragTick(){
  if(!DR)return;
  var y=DR.y,ih=window.innerHeight;
  if(y<110)window.scrollBy(0,-12);else if(y>ih-150)window.scrollBy(0,12);
  dragPlace();
}
function dragPlace(){
  var d=DR;if(!d)return;
  var row=d.row,sibs=Array.prototype.filter.call(d.box.children,function(x){return x!==row&&x.matches(d.sel)});
  row.style.transform='';
  var before=null;
  for(var i=0;i<sibs.length;i++){var r=sibs[i].getBoundingClientRect();if(d.y<r.top+r.height/2){before=sibs[i];break}}
  var first=Array.prototype.filter.call(d.box.children,function(x){return x.matches(d.sel)}),cur=row.nextElementSibling;
  while(cur&&!cur.matches(d.sel))cur=cur.nextElementSibling;
  if(before!==cur){
    var old=sibs.map(function(x){return x.getBoundingClientRect().top});
    if(before)d.box.insertBefore(row,before);else{var tail=sibs.length?sibs[sibs.length-1].nextElementSibling:null;d.box.insertBefore(row,tail)}
    d.moved=true;
    sibs.forEach(function(x,i){
      var dy=old[i]-x.getBoundingClientRect().top;if(!dy)return;
      x.style.transition='none';x.style.transform='translateY('+dy+'px)';
    });
    void d.box.offsetHeight;
    sibs.forEach(function(x){
      if(!x.style.transform)return;
      x.style.transition='transform .24s cubic-bezier(.2,.8,.2,1)';x.style.transform='';
      setTimeout(function(){x.style.transition=''},260);
    });
    buzz(6);
  }
  var rr=row.getBoundingClientRect();
  if(d.ph){d.ph.style.cssText='left:'+rr.left+'px;top:'+rr.top+'px;width:'+rr.width+'px;height:'+rr.height+'px'}
  row.style.transform='translateY('+(d.y-d.grab-rr.top)+'px) scale(1.03)';
}
document.addEventListener('pointerdown',function(e){
  var g=e.target.closest&&e.target.closest('.grip[data-drag]');if(!g||VIEW.name!=='tpl')return;
  e.preventDefault();e.stopPropagation();
  var kind=g.dataset.drag,row=kind==='c'?g.closest('section.sec'):g.closest('.swipe');if(!row)return;
  document.body.classList.add('dragmode');if(kind==='c')document.body.classList.add('dragcat');
  var rect=row.getBoundingClientRect(),ph=document.createElement('div');ph.className='dph';document.body.appendChild(ph);
  DR={row:row,box:row.parentNode,sel:kind==='c'?'section.sec':'.swipe',grab:rect.height/2,y:e.clientY,pid:e.pointerId,kind:kind,moved:false,el:g,ph:ph};
  try{g.setPointerCapture(e.pointerId)}catch(x){}
  row.classList.add('dragging');buzz(10);

/* ============ Wisch zurueck ============ */
(function(){
  var sx=0,sy=0,dx=0,on=false,app=null;
  function reset(anim){
    if(!app)return;
    if(anim){app.style.transition='transform .25s var(--out),opacity .25s';}
    app.style.transform='';app.style.opacity='';
    var a=app;setTimeout(function(){a.style.transition=''},300);
  }
  document.addEventListener('touchstart',function(e){
    if(VIEW.name==='home'||document.querySelector('.sheet')||e.touches.length!==1){on=false;return}
    var t=e.touches[0];if(t.clientX>26){on=false;return}
    sx=t.clientX;sy=t.clientY;dx=0;on=true;app=document.getElementById('app');
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!on)return;
    var t=e.touches[0],ddx=t.clientX-sx,ddy=t.clientY-sy;
    if(Math.abs(ddy)>Math.abs(ddx)*1.3&&ddx<24){on=false;reset(false);return}
    dx=Math.max(0,ddx);
    app.style.transition='none';
    app.style.transform='translateX('+(dx*0.85)+'px)';
    app.style.opacity=String(Math.max(.35,1-dx/(window.innerWidth*1.1)));
  },{passive:true});
  function end(){
    if(!on)return;on=false;
    var go2=dx>Math.min(110,window.innerWidth*0.3);
    if(go2&&Date.now()-lastPop>600){
      app.style.transition='transform .2s ease-in,opacity .2s';
      app.style.transform='translateX('+window.innerWidth+'px)';app.style.opacity='0';
      var a=app;setTimeout(function(){a.style.transition='';a.style.transform='';a.style.opacity='';buzz(8);goBack()},190);
    }else reset(true);
  }
  document.addEventListener('touchend',end,{passive:true});
  document.addEventListener('touchcancel',function(){if(on){on=false;reset(true)}},{passive:true});
})();

/* ============ Start ============ */
(function(){
  applySkin();
  var h=(location.hash||'').replace('#','').split('/');
  if(h[0]==='demo'){var t0=S.trips.filter(function(x){return /^Beispiel/.test(x.name)})[0]||demoTrip();VIEW.name='trip';VIEW.id=t0.id}
  else if(h[0]==='trip'&&tripById(h[1])){VIEW.name='trip';VIEW.id=h[1]}
  else if(h[0]==='tpl')VIEW.name='tpl';
  else if(h[0]==='settings')VIEW.name='settings';
  else if(h[0]==='allexp')VIEW.name='allexp';
  else if(h[0]==='allsp')VIEW.name='allsp';
  else if(h[0]==='recap')VIEW.name='recap';
  var tt=VIEW.id&&tripById(VIEW.id);if(tt){var cc=counts(tt);VIEW.full=cc.n>0&&cc.open===0}
  var q=location.search||'';if(/tab=exp/.test(q))VIEW.tab='exp';
  try{if(!(history.state&&history.state.app))history.replaceState({app:1,d:0,n:VIEW.name,id:VIEW.id},'',location.hash||'#'+VIEW.name)}catch(e){}
  render(true);
  setInterval(drinkCheck,60000);setInterval(tipCheck,45000);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')setTimeout(drinkCheck,1500)});
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
